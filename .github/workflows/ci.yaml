name: CI Karsajobs-UI

on:
  push:
    branches:
      - karsajobs-ui

jobs:
  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Hadolint
        run: |
          curl -sL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 -o hadolint
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/
      - name: Run hadolint
        run: hadolint Dockerfile

  build-app-karsajobs-ui:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    needs:
      - lint-dockerfile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Build container image
        run: docker build -t ghcr.io/kido1611/karsajobs-ui:latest .

      - name: Login to container registry
        env:
          PASSWORD_TOKEN: ${{ secrets.TOKEN }}
        run: echo "$PASSWORD_TOKEN" | docker login -u kido1611 --password-stdin ghcr.io

      - name: Push container image
        run: docker push ghcr.io/kido1611/karsajobs-ui:latest
