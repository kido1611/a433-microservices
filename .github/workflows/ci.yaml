name: CI Karsajobs

on:
  push:
    branches:
      - karsajobs

jobs:
  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Hadolint
        run: |
          curl -sL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 -o hadolint
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/
      - name: Run hadolint
        run: hadolint Dockerfile

  test-app:
    name: Test app
    runs-on: ubuntu-latest
    needs:
      - lint-dockerfile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Go 1.15
        uses: actions/setup-go@v5
        with:
          go-version: "1.15"

      - name: Test app
        run: go test -v -short --count=1 $(go list ./...)

  build-app-karsajobs:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    needs:
      - test-app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Build container image
        run: docker build -t ghcr.io/kido1611/karsajobs:latest .

      - name: Login to container registry
        env:
          PASSWORD_TOKEN: ${{ secrets.TOKEN }}
        run: echo "$PASSWORD_TOKEN" | docker login -u kido1611 --password-stdin ghcr.io

      - name: Push container image
        run: docker push ghcr.io/kido1611/karsajobs:latest
